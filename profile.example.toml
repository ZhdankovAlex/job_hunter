# Profile for scoring vacancy relevance — an example for a Python backend developer.
# Copy to profile.toml (it is in .gitignore) and adjust it to your CV; until profile.toml exists,
# the program reads this file.
#
# Vacancy score = sum of the weights of matched skills + adjustments from [scoring].
# pattern — a regular expression (case-insensitive), searched in the vacancy title and text.
# Skill weights and on/off can also be changed in the web UI (the Skills page): the edits
# are saved to profile_overrides.json, this file does not change.

[scoring]
title_python = 5          # Python / Django / FastAPI in the role title
title_backend = 3         # Backend in the title
title_database = 2        # PostgreSQL / Database in the title
title_senior = 1          # Senior in the title
title_product = 2         # a product role (Product Engineer and the like)
title_platform = -3       # platform / infrastructure: acceptable, but below product
outsourcing_text = -3     # "our client", "outstaffing", "staff augmentation" in the text
company_priority_per_point = 3  # for each company priority point (0–3) from companies.txt
russian_language = 0      # Russian in the requirements / "Russian-speaking team" / a vacancy in Russian
location_remote_ok = 4    # ✅ remote not tied to a country / home country ([home] in settings.toml)
location_relocation = 2   # 🌍 confirmed relocation
location_country = 1      # 🌍 unconfirmed / remote in the target country
location_residents = -4   # ❌ country residents only
location_other_country = -3  # ❓ remote tied to another country
language_mismatch = -8    # the primary language is not Python (Java, Ruby, …)
go_required = -15         # Go / Golang as a required language (instead of language_mismatch)
jvm_spring = -10          # JVM / Java Virtual Machine / Spring in the text
years_8_plus = -5         # "8+ years", "10+ years" of experience
penalty_experience_7 = -5   # 7 years of experience required
penalty_experience_8 = -5   # 8+ years required (on top of years_8_plus)
penalty_level = -5          # Staff / Principal / Head / Director in the title
penalty_ops_heavy = -5      # by the text the role is about operations (Terraform, Kubernetes, on-call…), not product
penalty_role = -8           # Data/Analytics Engineer, Data Scientist, Research, DevOps, SRE, Security
cv_full_match = 6           # full match with the CV (no gaps and mismatches)
cv_missing_each = -2        # for each required technology missing from the CV
cv_missing_cap = -10        # but no more than this in total
cv_mismatch_each = -3       # for a mismatch: experience, English level, education, primary language
freehire_relocation = 3     # freehire: relocation = supported
salary_eur_60k = 2          # salary from 60,000 EUR a year
local_language_nice = -1    # 🗣️ local language is a plus
not_english = -3            # the vacancy text is not in English (and not in Russian)

# --- Core ---------------------------------------------------------------------------
[[skills]]
name = "Python"
weight = 3
pattern = '\bpython\b'

[[skills]]
name = "PostgreSQL"
weight = 3
pattern = '\bpostgres(?:ql)?\b|\bpsql\b'

[[skills]]
name = "Django"
weight = 2
pattern = '\bdjango\b'

[[skills]]
name = "Flask / FastAPI"
weight = 2
pattern = '\bflask\b|fastapi|starlette|\baiohttp\b|\basyncio\b'

[[skills]]
name = "Backend / API design"
weight = 2
pattern = '\brest(?:ful)?\b|api design|\bapis?\b|openapi|swagger|graphql|grpc'

[[skills]]
name = "Distributed systems"
weight = 2
pattern = 'distributed (?:systems?|architecture|services)|microservices?'

# --- Application data and infrastructure ---------------------------------------------
[[skills]]
name = "SQL / query optimization"
weight = 2
pattern = '\bsql\b|n\+1|query (?:tuning|optimi[sz]ation)|indexing'

[[skills]]
name = "SQLAlchemy / ORM"
weight = 1
pattern = 'sqlalchemy|psycopg|alembic|\borm\b'

[[skills]]
name = "Redis"
weight = 1
pattern = '\bredis\b'

[[skills]]
name = "Message queues"
weight = 2
pattern = 'rabbitmq|\bkafka\b|\bamqp\b|message (?:queues?|brokers?)|event[\s-]driven|pub/?sub'

[[skills]]
name = "Background jobs"
weight = 1
pattern = 'background (?:jobs?|tasks?|processing)|celery|task queues?'

[[skills]]
name = "High-load / performance"
weight = 1
pattern = 'high[\s-]load|high[\s-]throughput|scalab\w+|low[\s-]latency'

[[skills]]
name = "Observability"
weight = 1
pattern = 'prometheus|grafana|opentelemetry|observability|monitoring'

[[skills]]
name = "Testing (pytest)"
weight = 1
pattern = 'pytest|unit tests?|test coverage|\btdd\b'

[[skills]]
name = "Static typing (mypy)"
weight = 1
pattern = '\bmypy\b|pyright|type hints|type annotations|static typing|type checking'

# --- Tools --------------------------------------------------------------------------
[[skills]]
name = "Docker"
weight = 1
pattern = '\bdocker\b|container\w*'

[[skills]]
name = "Kubernetes"
weight = 1
pattern = 'kubernetes|\bk8s\b|\bhelm\b'

[[skills]]
name = "CI/CD"
weight = 1
pattern = 'ci/cd|gitlab ci|github actions|jenkins'

[[skills]]
name = "AWS / GCP"
weight = 1
pattern = '\baws\b|\bs3\b|\bgcp\b|google cloud'

[[skills]]
name = "Linux"
weight = 1
pattern = '\blinux\b|\bbash\b'

# --- AI -------------------------------------------------------------------------
[[skills]]
name = "LLM / RAG"
weight = 1
pattern = '\bllms?\b|\brag\b|retrieval[\s-]augmented|embeddings?|vector (?:search|database|store)'
