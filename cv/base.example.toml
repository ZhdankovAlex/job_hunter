# An example CV base. Copy to cv/base.toml (it is in .gitignore) and replace it with your own facts;
# until cv/base.toml exists, the CV generator and the interview prep read this file.
# The generator invents nothing — it only selects and reorders what is written here.
#
# topics — the bullet's topics for matching to a vacancy (the topic list is in jobhunter/cvgen.py, TOPICS);
# technologies in the bullet text are detected automatically (the cv_match.TECH_RX dictionary).
# pin = true — the bullet is in every version of the CV.

name = "JANE DOE"
contacts = "jane.doe@example.com · +000 00 000 0000 · Central European Time (CET/CEST)"
links = [
  ["github.com/example", "https://github.com/example"],
]

# Technologies always shown in the stack line of a workplace (the rest — if the vacancy asks for them)
core_tech = ["Python", "PostgreSQL", "Docker"]
# Technologies only for the AI version of the CV (the backend version does not show them in the stack line)
ai_only_tech = ["ChromaDB"]

# Headline under the name: ai — for AI / LLM vacancies, backend — for the rest.
# If the vacancy is called differently (Python Developer, Software Engineer), the role in the headline adapts,
# the level (Senior, Lead…) is kept.
[headline]
backend = "Senior Backend Engineer | Python · PostgreSQL"
ai = "Senior Backend Engineer | Python · PostgreSQL · LLM / RAG"

# Summary = intro + 2–3 achievements that fit the vacancy best + closing
[summary]
intro = "Backend engineer with 5 years building services in Python and PostgreSQL."
closing = "Enjoys owning features end to end, from design to production support."
max_achievements = 3

[[summary.achievements]]
pin = true
text = "Designed a job-processing service handling 1M tasks a day."
topics = ["distributed", "highload"]

[[summary.achievements]]
text = "Cut API p95 latency from 800 ms to 120 ms by fixing N+1 queries."
topics = ["performance", "sql", "api"]

[[summary.achievements]]
text = "Built a retrieval layer for an internal RAG assistant."
summary_for = ["ai"]
requires = ["ai_tools", "llm"]
topics = ["llm"]

[[skills]]
group = "Languages and frameworks"
items = [
  { text = "Python", always = true },
  { text = "FastAPI", always = true },
  { text = "Django" },
]

[[skills]]
group = "Data and messaging"
items = [
  { text = "PostgreSQL", always = true },
  { text = "Redis" },
  { text = "Kafka" },
]

# Experience: bullets_max — how many bullets to keep (pin + those that fit the vacancy best)
[[experience]]
title = "Backend Engineer"
company = "Example Corp"
dates = "Jan 2022 – Present"
bullets_max = 4
intro = ["Product company, team of 6 engineers."]
tech = ["Python", "FastAPI", "PostgreSQL", "Redis", "Docker"]

[[experience.bullets]]
pin = true
text = "**Designed a job-processing service** on PostgreSQL and Redis handling 1M tasks a day."
topics = ["distributed", "highload"]

[[experience.bullets]]
text = "**Cut API p95 latency from 800 ms to 120 ms** by eliminating N+1 queries."
topics = ["performance", "sql", "api"]

# Pet projects: the Projects section after experience, only for vacancies with a topic from requires
# (TOPICS in cvgen.py), e.g. scraping — ATS, scrapers, job boards. Other CVs and the base CVs do not have it.
[[projects]]
name = "job-hunter"
kind = "open-source"
link = "https://github.com/example/job-hunter"
intro = "A job search pipeline: collects vacancies, scores them against the CV, builds a tailored CV."
stack = ["Python", "FastAPI", "pytest"]
requires = ["scraping"]
bullets_max = 3

[[projects.bullets]]
text = "**Aggregates vacancies from 5 ATS APIs** into one model; polite scraping with robots.txt and 1 req/s per host."
topics = ["scraping", "integrations"]

[[projects.bullets]]
text = "**Property-based API tests** generated from the OpenAPI schema."
topics = ["quality", "api"]

[publications]
text = ""

[education]
degree = "B.Sc. in Computer Science"
years = "2016 – 2020"
school = "Example University"
# thesis line shown under the school in the CV for AI / LLM vacancies (not in the one-page variant)
thesis_ai = "Thesis: text classification with neural networks"

[languages]
text = "English — C1"

# --- Story bank for behavioural questions (jobhunter/interview_prep.py) ---
# Only facts from the experience bullets above: situation → action → result.
# questions: initiative | early_detection | pushback | research | incident | ownership
# draft = true — a draft, check the wording.

[[stories]]
title = "Latency fix"
questions = ["initiative"]
topics = ["performance"]
situation = "The main API endpoint was slow under load."
action = "Profiled queries, removed N+1 patterns and added an index."
result = "p95 latency dropped from 800 ms to 120 ms."

# Cover letter (jobhunter/cover_letter.py): {company}, {title} are taken from the vacancy.
# soft — how I work; picked for the vacancy by topics and text, requires — as for achievements.
[cover]
greeting = "Hi {company} team,"
intro = "I'm a Backend Engineer with 5 years of Python and PostgreSQL."
opening = "Your {title} role matches what I've been doing, so I'd like to apply."
lead_short = "What I can bring:"
lead_full = "Most relevant to your role:"
missing = "I haven't worked with {missing} in production yet, and I'm happy to ramp up on it."
closing = "I'd be glad to have a call and discuss the role in more detail."
sign = "Best regards,"

[[cover.soft]]
text = "I own features end to end, from design to production support."
topics = ["architecture"]

[[cover.soft]]
text = "I write documentation the team relies on and help teammates with technical questions."
topics = ["quality"]
