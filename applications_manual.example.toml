# Example: application histories not from mail (Telegram, LinkedIn, calls). Your own file is applications_manual.toml
# (it is in .gitignore); you do not have to create it: the web UI (Applications → form) creates it.
# The events are added to reports/applications.html together with the letters;
# if the company is in the mail too, the events are merged.
#
# kind: applied (applied / first contact) | interview (a stage) | rejected | declined (declined by you) | offer | other
# date — time of the conversation, note — what happened, url — link to the vacancy (optional).

[[application]]
company = "Example Corp"
source = "Telegram, recruiter"
events = [
  { date = 2026-01-10T12:00:00, kind = "applied", note = "A recruiter wrote about a Senior Python Developer vacancy", url = "https://example.com/jobs/123" },
  { date = 2026-01-15T14:00:00, kind = "interview", note = "Technical interview" },
  { date = 2026-01-20T10:00:00, kind = "rejected", note = "Rejected after the interview" },
]
