# Проверки на каждый PR и пуш в main: линтер, потом тесты.
# Тесты работают без сети и без личных файлов: настройки — settings.example.toml, резюме — cv/base.example.toml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Зависимости
        run: pip install -r requirements-dev.txt
      - name: Линтер (ruff)
        run: ruff check .
      - name: Тесты (pytest)
        run: pytest -q
