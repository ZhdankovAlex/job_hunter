# Checks on every PR and push to main: linter, types, then tests.
# Tests run without network and without personal files: settings — settings.example.toml, CV — cv/base.example.toml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dependencies
        run: pip install -r requirements-dev.txt
      - name: Linter (ruff)
        run: ruff check .
      - name: Types (mypy)
        run: mypy
      - name: Tests (pytest) with coverage
        run: pytest -q --cov --cov-report=term --cov-report=xml
      # the per-module coverage table goes to the run page (Summary); the floor was checked by the step above
      - name: Coverage in the run summary
        if: ${{ !cancelled() }}
        run: coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
      # history, per-file view and a comment on every PR; without the CODECOV_TOKEN secret it only warns
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
