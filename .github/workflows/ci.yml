# Checks on every PR and push to main: linter, types, tests — on Linux and Windows; a separate dependency audit.
# Tests run without network and without personal files: settings — settings.example.toml, CV — cv/base.example.toml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # the tool is mostly run on Windows, so CI checks both platforms
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Dependencies (exact versions)
        run: pip install -r requirements-lock.txt
      - name: Linter (ruff)
        run: ruff check .
      - name: Types (mypy)
        run: mypy
      - name: Tests (pytest) with coverage
        id: tests
        run: pytest -q --cov --cov-report=term --cov-report=xml
      # the per-module coverage table goes to the run page (Summary); the floor was checked by the step above
      - name: Coverage in the run summary
        # only if the tests ran: after a failed install there is no coverage (exit 127)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && steps.tests.outcome != 'skipped' }}
        run: coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
      # history, per-file view and a comment on every PR; without the CODECOV_TOKEN secret it only warns
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && steps.tests.outcome != 'skipped' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  audit:
    # known vulnerabilities in the pinned versions (PyPI / OSV database)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r requirements-lock.txt --no-deps
