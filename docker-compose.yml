# docker compose up -d --build   ->  http://127.0.0.1:8765
#
# Code and all data (state/, reports/, cv_out/, settings, Gmail token) stay in the project folder on the host:
# it is mounted at /app, the container keeps nothing inside. The port is published on 127.0.0.1 only —
# reports contain mail, applications and contacts.
services:
  jobhunter:
    build: .
    image: jobhunter:local
    container_name: jobhunter
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - .:/app
      # the Windows virtual environment from the project folder is neither needed nor usable in the container
      - /app/.venv
    environment:
      # the daily "everything" run (mail, then vacancies), like run_daily.bat; empty — off
      JOBHUNTER_DAILY_AT: "09:00"
    restart: unless-stopped
