# Tool settings only: the project is not installed as a package, dependencies are in requirements*.txt

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
# measured with pytest --cov (CI does it on every PR)
source = ["jobhunter", "web"]
# web/__main__.py is only argument parsing and uvicorn.run: a test would start a real server and browser,
# and the app itself (web/app.py) is covered through TestClient
omit = ["web/__main__.py"]

[tool.coverage.report]
# a floor just under the current total (84.6%), so coverage does not quietly drop; raise it as tests are added
fail_under = 82
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["cv_out", "reports", "state"]

[tool.ruff.lint]
# syntax, pyflakes, bugbear catch real bugs; I, UP, SIM, RUF keep imports sorted, the syntax modern,
# branches lean, and catch traps (mutable class attributes, unused noqa)
select = ["E9", "F", "B", "I", "UP", "SIM", "RUF"]
ignore = [
    "B904", "B905",  # raise without from and zip without strict are not bugs in this code
    "RUF001", "RUF002", "RUF003",  # "ambiguous characters": Cyrillic, "—" and "…" in the project's texts are fine
    "SIM905",  # long word lists read better as "a b c".split() than as a line of literals
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
# third-party packages without stubs do not fail the check
python_version = "3.11"
files = ["jobhunter", "web", "main.py", "cvgen.py", "tests/conftest.py", ".claude/hooks"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
# bodies of unannotated functions are checked too (their parameters are Any)
check_untyped_defs = true

# strict mode on the key modules (network, models, classifiers, web); the rest goes step by step
[[tool.mypy.overrides]]
module = [
    "jobhunter.http",
    "jobhunter.models",
    "jobhunter.stack",
    "jobhunter.industry",
    "jobhunter.companies",
    "web.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
warn_return_any = true
