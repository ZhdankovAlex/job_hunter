# Tool settings only: the project is not installed as a package, dependencies are in requirements*.txt

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["cv_out", "reports", "state"]

[tool.ruff.lint]
# only what catches real bugs: syntax, pyflakes, bugbear
select = ["E9", "F", "B"]
# raise without from and zip without strict are not bugs in this code
ignore = ["B904", "B905"]
