# Tool settings only: the project is not installed as a package, dependencies are in requirements*.txt

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
# measured with pytest --cov (CI does it on every PR)
source = ["jobhunter", "web"]

[tool.coverage.report]
# a floor just under the current total (70%), so coverage does not quietly drop; raise it as tests are added
fail_under = 68
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["cv_out", "reports", "state"]

[tool.ruff.lint]
# only what catches real bugs: syntax, pyflakes, bugbear
select = ["E9", "F", "B"]
# raise without from and zip without strict are not bugs in this code
ignore = ["B904", "B905"]

[tool.mypy]
# third-party packages without stubs do not fail the check
python_version = "3.11"
files = ["jobhunter", "web", "main.py", "cvgen.py", "tests/conftest.py"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
# bodies of unannotated functions are checked too (their parameters are Any)
check_untyped_defs = true
