# Только настройки инструментов: проект не ставится как пакет, зависимости — в requirements*.txt

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["cv_out", "reports", "state"]

[tool.ruff.lint]
# только то, что ловит настоящие ошибки: синтаксис, pyflakes, bugbear
select = ["E9", "F", "B"]
# raise без from и zip без strict — не ошибки в этом коде
ignore = ["B904", "B905"]
